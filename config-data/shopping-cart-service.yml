spring:
  application:
    name: shopping-cart-service

  security:
    jwt:
      private:
        key: ${PRIVATE_KEY}
      user:
        generator: ${USER_GENERATOR}

  datasource:
    url: jdbc:h2:mem:service_cart;MODE=MySQL;DB_CLOSE_DELAY=-1;
    driverClassName: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

