spring:
  application:
    name: auth-service

  security:
    jwt:
      private:
        key: ${PRIVATE_KEY}
      user:
        generator: ${USER_GENERATOR}


  datasource:
    url: jdbc:h2:mem:service_auth;MODE=MySQL;DB_CLOSE_DELAY=-1;
    driverClassName: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console
app:
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
  service:
    username: ${SERVICE_USERNAME}
    password: ${SERVICE_PASSWORD}


server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

